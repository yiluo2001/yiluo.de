<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gemini Chat - Store</title>
<link rel="stylesheet" href="main.css">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<style>
    /* Chat Box Layout Styles (black / white / grey only) */
    .chat-container {
        display: flex;
        flex-direction: column;
        height: 500px;
        border: 1px solid #e0e0e0;
        border-radius: 8px;
        background: #ffffff;
        margin-top: 15px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }
    .chat-messages {
        flex: 1;
        padding: 20px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 12px;
    }
    .message {
        max-width: 75%;
        padding: 12px 16px;
        border-radius: 8px;
        font-size: 14px;
        line-height: 1.5;
        word-wrap: break-word;
    }
    .user-message {
        align-self: flex-end;
        background-color: #333333;
        color: #ffffff;
        border-bottom-right-radius: 2px;
    }
    .ai-message {
        align-self: flex-start;
        background-color: #f1f1f1;
        color: #333333;
        border-bottom-left-radius: 2px;
    }
    .ai-message.loading {
        color: #888888;
        font-style: italic;
    }

    /* Markdown formatting inside AI messages */
    .ai-message { white-space: normal; }
    .ai-message > :first-child { margin-top: 0; }
    .ai-message > :last-child { margin-bottom: 0; }
    .ai-message p { margin: 0 0 10px; }
    .ai-message h1, .ai-message h2, .ai-message h3, .ai-message h4 {
        margin: 14px 0 8px; line-height: 1.3; color: #000000;
    }
    .ai-message h1 { font-size: 1.3em; }
    .ai-message h2 { font-size: 1.15em; }
    .ai-message h3 { font-size: 1.05em; }
    .ai-message ul, .ai-message ol { margin: 0 0 10px; padding-left: 22px; }
    .ai-message li { margin-bottom: 4px; }
    .ai-message code {
        background: #e2e2e2; padding: 2px 5px; border-radius: 4px;
        font-family: Consolas, Menlo, monospace; font-size: 0.9em;
    }
    .ai-message pre {
        background: #2b2b2b; color: #f5f5f5; padding: 12px;
        border-radius: 6px; overflow-x: auto; margin: 0 0 10px;
    }
    .ai-message pre code { background: none; padding: 0; color: inherit; }
    .ai-message blockquote {
        margin: 0 0 10px; padding-left: 12px;
        border-left: 3px solid #aaaaaa; color: #555555;
    }
    .ai-message table { border-collapse: collapse; margin: 0 0 10px; display: block; overflow-x: auto; }
    .ai-message th, .ai-message td { border: 1px solid #cccccc; padding: 6px 10px; }
    .ai-message th { background: #e6e6e6; }
    .ai-message a { color: #000000; text-decoration: underline; }
    .ai-message hr { border: none; border-top: 1px solid #cccccc; margin: 12px 0; }

    .chat-input-area {
        display: flex;
        padding: 12px;
        border-top: 1px solid #e0e0e0;
        background: #fafafa;
        border-bottom-left-radius: 8px;
        border-bottom-right-radius: 8px;
    }
    .chat-input-area input {
        flex: 1;
        padding: 10px 14px;
        border: 1px solid #cccccc;
        border-radius: 4px;
        outline: none;
        font-size: 14px;
        color: #333333;
        background: #ffffff;
    }
    .chat-input-area input:focus {
        border-color: #333333;
    }
    .chat-input-area button {
        margin-left: 10px;
        padding: 10px 20px;
        background-color: #333333;
        color: #ffffff;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-weight: 500;
    }
    .chat-input-area button:hover {
        background-color: #000000;
    }
</style>
</head>

<body>
<div class="page-wrapper">
    <div class="paper">
        <!-- part 1 -->
        <header class="paper-header">
            <div class="breadcrumbs">
                <a href="https://www.yiluo.de">Yi Luo</a>
            </div>
        </header>

        <!-- part 2 -->
        <div class="paper-top-strip">
            <nav class="main-nav" style="display: flex;">
                <a href="products.html">Products</a>
                <a href="cart.html">Cart</a>
                <a href="orders.html">Orders</a>
            </nav>
        </div>
        
        <!-- part 3 -->
        <main class="paper-content">
            <h1>AI Assistant Chat</h1>
            <p>Chat directly with your Gemini-powered assistant running through your backend proxy.</p>
            
            <div class="chat-container">
                <div id="chat-messages" class="chat-messages">
                    <div class="message ai-message">Hello! How can I help you today?</div>
                </div>
                <div class="chat-input-area">
                    <input type="text" id="chat-input" placeholder="Type your message here..." autocomplete="off">
                    <button id="send-btn">Send</button>
                </div>
            </div>
        </main>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const chatMessages = document.getElementById('chat-messages');
        const chatInput = document.getElementById('chat-input');
        const sendBtn = document.getElementById('send-btn');

        async function sendMessage() {
            const text = chatInput.value.trim();
            if (!text) return;

            appendMessage(text, 'user-message');
            chatInput.value = '';
            scrollToBottom();

            const loadingId = appendMessage('Thinking...', 'ai-message loading');
            scrollToBottom();

            try {
                const response = await fetch(`${BASE_URL}/api/chat`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ message: text })
                });

                if (!response.ok) throw new Error('Failed to connect to backend');

                const data = await response.json();
                
                document.getElementById(loadingId).remove();
                appendMessage(data.reply, 'ai-message', true);
            } catch (error) {
                document.getElementById(loadingId).remove();
                appendMessage('Error: Unable to reach the chat server.', 'ai-message');
            }
            scrollToBottom();
        }

        function appendMessage(text, className, isMarkdown = false) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${className}`;
            if (isMarkdown) {
                msgDiv.innerHTML = DOMPurify.sanitize(marked.parse(text, { breaks: true }));
                msgDiv.querySelectorAll('a').forEach(a => {
                    a.target = '_blank';
                    a.rel = 'noopener noreferrer';
                });
            } else {
                msgDiv.textContent = text;
            }
            const uniqueId = 'msg-' + Date.now() + '-' + Math.random().toString(36).substring(2, 9);
            msgDiv.id = uniqueId;
            chatMessages.appendChild(msgDiv);
            return uniqueId;
        }

        function scrollToBottom() {
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        sendBtn.addEventListener('click', sendMessage);
        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    });
</script>
</body>
</html>
